<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>ข้อสอบปลายภาค พล 092028</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAF7F1;--surface:#fff;--surface-2:#F1ECE1;--ink:#17231F;--ink-soft:#4B5C55;--muted:#6B7A73;--primary:#14534C;--primary-ink:#fff;--primary-soft:#E4EFEC;--accent:#C1782E;--accent-ink:#fff;--danger:#A6402F;--danger-soft:#F7E7E2;--ok:#2F7A4F;--ok-soft:#E3F1E8;--border:rgba(23,35,31,.14);--shadow:0 1px 2px rgba(23,35,31,.06),0 8px 24px rgba(23,35,31,.06);--radius:14px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1613;--surface:#17211D;--surface-2:#1E2A25;--ink:#EAF2EE;--ink-soft:#C2D0CA;--muted:#93A69E;--primary:#4FA495;--primary-ink:#08211C;--primary-soft:#1B322C;--accent:#E0A05C;--accent-ink:#2B1804;--danger:#E2897A;--danger-soft:#3A211D;--ok:#7FC79A;--ok-soft:#1B3325;--border:rgba(234,242,238,.14);--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#0F1613;--surface:#17211D;--surface-2:#1E2A25;--ink:#EAF2EE;--ink-soft:#C2D0CA;--muted:#93A69E;--primary:#4FA495;--primary-ink:#08211C;--primary-soft:#1B322C;--accent:#E0A05C;--accent-ink:#2B1804;--danger:#E2897A;--danger-soft:#3A211D;--ok:#7FC79A;--ok-soft:#1B3325;--border:rgba(234,242,238,.14);--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);font-family:'Sarabun','TH SarabunPSK','Noto Sans Thai',sans-serif;margin:0;-webkit-text-size-adjust:100%}
body{min-height:100%;line-height:1.65;font-size:16px}
h1,h2,h3{font-weight:700;margin:0 0 6px;color:var(--ink);line-height:1.35}
h1{font-size:24px}h2{font-size:19px}h3{font-size:17px}
p{margin:0 0 10px;color:var(--ink-soft)}
.top-strip{height:6px;background:linear-gradient(90deg,var(--primary),var(--accent))}
.wrap{max-width:820px;margin:0 auto;padding:24px 18px 60px}
.wrap.wide{max-width:1240px}
.brand{font-size:13px;color:var(--muted);margin-bottom:18px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;margin-bottom:16px}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 2px}
.pill{background:var(--primary-soft);color:var(--primary);border-radius:999px;padding:5px 14px;font-size:13.5px;font-weight:600}
.pill.warn{background:var(--danger-soft);color:var(--danger)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.field{margin-bottom:14px}
.field label,.lbl{display:block;font-size:14px;font-weight:600;color:var(--ink);margin-bottom:5px}
.field input,.field select,.field textarea,.input{width:100%;padding:11px 13px;font-size:16px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--ink);font-family:inherit}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.field-row{grid-template-columns:1fr}}
input:focus,textarea:focus,select:focus,button:focus-visible,summary:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:10px;padding:12px 22px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;transition:transform .08s ease,opacity .15s ease}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--primary);color:var(--primary-ink)}
.btn-accent{background:var(--accent);color:var(--accent-ink)}
.btn-danger{background:var(--danger);color:#fff}
.btn-ghost{background:transparent;color:var(--primary);border:1px solid var(--border)}
.btn-block{width:100%}
.btn-sm{padding:7px 14px;font-size:14px}
.notice{border-radius:10px;padding:12px 15px;font-size:14.5px;margin-bottom:14px}
.notice-warn{background:var(--danger-soft);color:var(--danger)}
.notice-info{background:var(--primary-soft);color:var(--primary)}
.notice-ok{background:var(--ok-soft);color:var(--ok)}
ul.rules,ol.rules{margin:8px 0 0;padding-left:22px;color:var(--ink-soft);font-size:15px}
ul.rules li,ol.rules li{margin-bottom:7px}
.checkrow{display:flex;gap:10px;align-items:flex-start;margin:14px 0;font-size:15px;color:var(--ink)}
.checkrow input{margin-top:5px;accent-color:var(--primary);width:18px;height:18px;flex-shrink:0}
.center{text-align:center;padding:26px 8px}
.spinner{width:40px;height:40px;border-radius:50%;border:4px solid var(--border);border-top-color:var(--primary);margin:0 auto 16px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.big-icon{font-size:44px;margin-bottom:8px}
.modal-overlay{position:fixed;inset:0;background:rgba(15,22,19,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}
.modal-box{background:var(--surface);border-radius:var(--radius);padding:22px;max-width:460px;width:100%;box-shadow:var(--shadow);border:1px solid var(--border);max-height:90vh;overflow:auto}
.modal-actions{display:flex;gap:10px;margin-top:16px}
.modal-actions .btn{flex:1}
.footnote{font-size:12.5px;color:var(--muted);margin-top:8px}
.admin-link{text-align:center;margin-top:10px}
.admin-link a{color:var(--muted);font-size:13px;text-decoration:underline;cursor:pointer}
.cite-list{margin:6px 0 0;padding-left:20px;font-size:13.5px;color:var(--ink-soft)}
.cite-list li{margin-bottom:4px;font-family:ui-monospace,monospace}
.muted{color:var(--muted)}
.hide{display:none!important}

.sticky-bar{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top,0px)}
.bar-inner{max-width:820px;margin:0 auto;padding:8px 18px;display:grid;grid-template-columns:1.2fr 1fr 1.2fr;gap:10px}
.bar-item{display:flex;flex-direction:column;min-width:0}
.bar-label{font-size:12px;color:var(--muted)}
.bar-value{font-size:19px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-value.small{font-size:14px;font-weight:600;padding-top:3px}
.bar-value.low{color:var(--danger)}
.bar-value.warn{color:var(--accent)}
details.case{border:1px solid var(--border);border-radius:12px;padding:0 16px;background:var(--surface)}
details.case>summary{cursor:pointer;font-weight:700;padding:12px 0;color:var(--primary)}
.case-body{padding-bottom:14px}
.case-body p{color:var(--ink)}
.case-body ul,.case-body ol{margin:6px 0 10px;padding-left:22px;color:var(--ink)}
.case-body li{margin-bottom:6px}
textarea#answer{width:100%;min-height:62vh;min-height:62dvh;padding:14px 15px;font-size:17px;line-height:1.75;border:1px solid var(--border);border-radius:12px;background:var(--bg);color:var(--ink);font-family:inherit;resize:vertical}
.counter{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13.5px;color:var(--muted);margin:8px 0 14px}
.counter b{color:var(--ink)}
/* ---- admin (สำหรับอาจารย์) ---- */
.topbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:14px}
.topbar .actions{display:flex;gap:8px;flex-wrap:wrap}
.toolbar{display:grid;grid-template-columns:1fr 240px;gap:10px;margin:12px 0}
@media (max-width:640px){.toolbar{grid-template-columns:1fr}}
.tscroll{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--border);white-space:nowrap;vertical-align:middle}
table.t th{color:var(--muted);font-weight:600;font-size:13px;cursor:pointer;user-select:none}
table.t tr.row:hover{background:var(--surface-2)}
.tag{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600}
.tag.prog{background:var(--primary-soft);color:var(--primary)}
.tag.done{background:var(--ok-soft);color:var(--ok)}
.tag.auto{background:var(--danger-soft);color:var(--danger)}
.tag.warn{background:#fdf0d8;color:#8a5a12}
@media (prefers-color-scheme:dark){.tag.warn{background:#3b2f14;color:#e6b866}}
.split{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:980px){.split{grid-template-columns:1fr}}
.sticky-col{position:sticky;top:12px}
@media (max-width:980px){.sticky-col{position:static}}
.essay{white-space:pre-wrap;word-break:break-word;font-size:17px;line-height:1.85;color:var(--ink);background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:16px}
table.kv{width:100%;border-collapse:collapse;font-size:14.5px}
table.kv td{padding:6px 4px;border-bottom:1px solid var(--border);vertical-align:top}
table.kv td:first-child{color:var(--muted);width:38%}
.crit{border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:12px;background:var(--surface)}
.crit-head{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.lvl{border:1px solid var(--border);background:var(--bg);color:var(--ink-soft);border-radius:9px;padding:7px 4px;font-family:inherit;font-size:13px;cursor:pointer;line-height:1.3}
.lvl small{display:block;color:var(--muted);font-size:12px}
.lvl.on{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.lvl.on small{color:var(--primary-ink);opacity:.85}
.pointrow{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.pointrow input{width:74px;text-align:center;padding:8px;font-size:17px;font-weight:700;border:1px solid var(--border);border-radius:9px;background:var(--bg);color:var(--ink);font-family:inherit}
.step{width:36px;height:36px;border-radius:9px;border:1px solid var(--border);background:var(--bg);color:var(--ink);font-size:18px;cursor:pointer;font-family:inherit}
.lvl-desc{font-size:13.5px;color:var(--ink-soft);margin:6px 0}
details.kp summary{cursor:pointer;color:var(--primary);font-size:13.5px;font-weight:600}
details.kp ul{margin:6px 0 2px;padding-left:20px;font-size:13.5px;color:var(--ink-soft)}
.totalbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;background:var(--primary-soft);border-radius:12px;margin:10px 0}
.totalbar b{font-size:24px;color:var(--primary)}
.navrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
textarea.cmt{width:100%;min-height:90px;padding:10px 12px;font-size:15px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--ink);font-family:inherit}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:999px;font-size:15px;z-index:200}
.cite-list{margin:6px 0 0;padding-left:20px;font-size:13.5px;color:var(--ink-soft)}
.cite-list li{margin-bottom:4px;font-family:ui-monospace,monospace}
.ai-reason{font-size:13px;color:var(--ink-soft);margin:4px 0 2px;padding:6px 8px;background:var(--surface-2);border-radius:8px;display:none}
.ai-reason.show{display:block}
</style>
</head>

<div id="root"></div>

<script>

ราะห์ต่อเนื่อง ความยาวประมาณ 1,500–2,000 คำ (ระบบแสดงจำนวนคำโดยประมาณให้) ใช้ภาษาวิชาการ แบ่งหัวข้อได้ตามความเหมาะสม (ระบบรองรับข้อความธรรมดา) อ้างอิงแนวคิดสำคัญด้วยรูปแบบการอ้างอิงในเนื้อหาแบบ APA 7 (เช่น Whitehead (2019) หรือ (Magill & Anderson, 2021)) ทุกครั้งที่กล่าวถึงทฤษฎีหรือแนวคิด ไม่ต้องแนบรายการอ้างอิงท้ายบท (Reference List) เนื่องจากเป็นข้อสอบปิดหนังสือ"};

/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function serverNow(){return Date.now()+clockOffset;}
function pad(n){return String(n).padStart(2,'0');}
function fmtRemain(ms){ms=Math.max(0,ms);const s=Math.floor(ms/1000);return pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60);}
function fmtClock(ms){const d=new Date(ms);return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());}
function countWords(text){
  const t=String(text||'').trim(); if(!t) return 0;
  try{ if(typeof Intl!=='undefined'&&Intl.Segmenter){ const seg=new Intl.Segmenter('th',{granularity:'word'}); let n=0; for(const s of seg.segment(t)) if(s.isWordLike) n++; return n; } }catch(e){}
  return Math.round(t.replace(/\s/g,'').length/4.5);
}
function showModal(html, persist){
  const o=document.createElement('div'); o.className='modal-overlay';
  o.innerHTML='<div class="modal-box">'+html+'</div>'; document.body.appendChild(o);
  if(!persist) o.addEventListener('click',e=>{if(e.target===o) o.remove();});
  return o;
}
function closeModals(){document.querySelectorAll('.modal-overlay').forEach(m=>m.remove());}
async function apiPost(body, tries){
  tries=tries||1;
  for(let i=1;i<=tries;i++){
    try{
      const res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      const data=await res.json();
      return {ok:true,status:res.status,data};
    }catch(e){ if(i<tries) await new Promise(r=>setTimeout(r,700*i)); }
  }
  return {ok:false};
}
function lsGet(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}

function readForm(){
  const v=id=>document.getElementById(id).value.trim();
  return {name:v('f-name'),lastname:v('f-last'),studentId:v('f-sid'),section:v('f-sec')};
}

function onStartClick(){
  const f=readForm();
  if(!f.name||!f.lastname||!f.studentId){
    showModal('<h3>กรอกข้อมูลไม่ครบ</h3><p>กรุณากรอกชื่อ นามสกุล และรหัสนักศึกษาให้ครบ</p><div class="modal-actions"><button class="btn btn-primary" id="m-ok">เข้าใจแล้ว</button></div>');
    document.getElementById('m-ok').onclick=closeModals; return;
  }
  if(!document.getElementById('f-ok').checked){
    showModal('<h3>ยังไม่ได้ยืนยัน</h3><p>กรุณาติ๊กช่องยืนยันว่าได้อ่านและเข้าใจคำชี้แจงทั้งหมดก่อนเริ่มสอบ</p><div class="modal-actions"><button class="btn btn-primary" id="m-ok">เข้าใจแล้ว</button></div>');
    document.getElementById('m-ok').onclick=closeModals; return;
  }
  showModal(`<h3>ยืนยันการเริ่มสอบ</h3>
    <p><b>${esc(f.name)} ${esc(f.lastname)}</b> · รหัส ${esc(f.studentId)}</p>
    <p>เมื่อกดยืนยัน ระบบจะเริ่มนับเวลา ${EXAM.hours} ชั่วโมงทันที และจะไม่สามารถเริ่มใหม่ได้ (หากเคยเริ่มไปแล้ว ระบบจะพาท่านกลับไปทำต่อ)</p>
    <div class="modal-actions"><button class="btn btn-ghost" id="m-cancel">ยกเลิก</button><button class="btn btn-primary" id="m-go">ยืนยันเริ่มสอบ</button></div>`, true);
  document.getElementById('m-cancel').onclick=closeModals;
  document.getElementById('m-go').onclick=()=>{closeModals();doStart(f);};
}

function renderBusy(msg){
  root.innerHTML='<div class="wrap"><div class="card center"><div class="spinner"></div><h3>'+esc(msg)+'</h3><p>กรุณารอสักครู่</p></div></div>';
}

async function doStart(f){
  renderBusy('กำลังเริ่มการสอบ...');
  const r=await apiPost(Object.assign({action:'start'},f),2);
  handleOpenResult(r,f);
}

function handleOpenResult(r,f){
  if(!r.ok){ renderLanding('เชื่อมต่อระบบไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองอีกครั้ง',f); return; }
  const d=r.data||{};
  if(r.status===403&&d.err==='identity_mismatch'){ renderLanding('ชื่อ-นามสกุลไม่ตรงกับที่ลงทะเบียนไว้กับรหัสนักศึกษานี้ กรุณาตรวจสอบการสะกดอีกครั้ง หากยังไม่ได้ให้ติดต่ออาจารย์ผู้สอน',f); return; }
  if(!d.ok){ renderLanding('ไม่สามารถเริ่มการสอบได้ ('+esc(d.err||'unknown')+') กรุณาลองอีกครั้ง หรือแจ้งอาจารย์ผู้สอน',f); return; }

  if(d.state==='submitted'){ lsDel(LS_ID); lsDel(LS_DRAFT); renderClosed(d.reason,f,true); return; }

/* ---------- exam ---------- */
function enterExam(f,d){
  const s=d.session;
  identity={studentId:f.studentId,name:f.name,lastname:f.lastname,section:f.section||'',token:s.token};
  deadlineAt=s.deadlineAt; clockOffset=s.serverNow-Date.now(); leaveCount=s.leaveCount||0;
  lsSet(LS_ID,identity);
  const server=d.draft||{text:'',savedAt:0,pasteEvents:[]};
  const local=lsGet(LS_DRAFT);
  let text=server.text||''; pasteEvents=server.pasteEvents||[];
  if(local&&local.studentId===identity.studentId&&(local.savedAt+clockOffset)>(server.savedAt||0)&&typeof local.text==='string'){
    text=local.text; pasteEvents=local.pasteEvents||pasteEvents;
  }
  examActive=true; closing=false; submitting=false; dirty=false; away=null; warned.clear();
  guardBack();
  renderExam(text);
  if(text!==(server.text||'')) { dirty=true; saveNow(); }
}

function onInput(){

function onPaste(e){
  let len=0;
  try{ len=((e.clipboardData||window.clipboardData).getData('text')||'').length; }catch(x){}
  pasteEvents.push({at:serverNow(),length:len});

function updateCounters(){
  const ta=document.getElementById('answer'); if(!ta) return;

}
function updateBadge(){
  const el=document.getElementById('leave-badge'); if(!el) return;

}
function updateSaveStatus(msg){
  const el=document.getElementById('save-status'); if(!el) return;
  el.textContent=msg||(lastSavedAt?fmtClock(lastSavedAt):'ยังไม่บันทึก');

function tick(){
  if(!examActive) return;
  const rem=deadlineAt-serverNow();
  const el=document.getElementById('countdown');
  if(el){ el.textContent=fmtRemain(rem); el.className='bar-value'+(rem<600000?' low':(rem<3600000?' warn':'')); }
  if(rem<=0&&!submitting) finalSubmit(true);
}

async function saveNow(){
  if(!examActive||saving||submitting) return;
  const ta=document.getElementById('answer'); if(!ta) return;
  saving=true; const sent=ta.value;
  const r=await apiPost({action:'save',studentId:identity.studentId,token:identity.token,text:sent,pasteEvents});
  saving=false;
  if(r.ok&&r.data&&r.data.ok){
    if(r.data.state==='submitted'){ closeExam(r.data.reason); return; }
    clockOffset=r.data.serverNow-Date.now();
    lastSavedAt=Date.now();
    if(ta.value===sent) dirty=false;
    if(typeof r.data.leaveCount==='number'){ leaveCount=r.data.leaveCount; updateBadge(); }
    updateSaveStatus(); const n=document.getElementById('net-status'); if(n) n.textContent='';
  }else{
    const n=document.getElementById('net-status'); if(n) n.textContent='บันทึกขึ้นระบบไม่สำเร็จ (เก็บไว้ในเครื่องแล้ว จะลองใหม่)';
  }
}

/* ---------- leaving the screen ---------- */
function bodyForLeave(ev){
  const ta=document.getElementById('answer');
  const body={action:'leave',studentId:identity.studentId,token:identity.token,eventId:ev.id,kind:ev.kind,at:ev.start+clockOffset,counted:ev.counted,durationMs:ev.durationMs==null?null:ev.durationMs,pasteEvents};
  if(ta&&ta.value.length<=MAX_KEEPALIVE_CHARS) body.text=ta.value;
  return body;
}
async function reportLeave(ev,keepalive){
  try{
    const res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(bodyForLeave(ev)),keepalive:!!keepalive});
    return {ok:true,data:await res.json()};
  }catch(e){ return {ok:false}; }
}
async function reportLeaveRetry(ev){
  for(let i=0;i<4;i++){
    const r=await reportLeave(ev,false);
    if(r.ok&&r.data&&r.data.ok) return r;
    await new Promise(x=>setTimeout(x,1500*(i+1)));
  }
  return {ok:false};
}
function applyLeaveResponse(r,ev,showNow){
  if(!r||!r.ok||!r.data||!r.data.ok) return;
  if(typeof r.data.leaveCount==='number'){ leaveCount=r.data.leaveCount; updateBadge(); }
  if(r.data.state==='submitted'){ closeExam(r.data.reason||'auto_leave'); return; }
  if(showNow&&ev.counted&&!warned.has(ev.id)){ warned.add(ev.id); showLeaveWarning(); }
}
function showLeaveWarning(){
  const remain=EXAM.maxLeaves-leaveCount;
  const lastWarning=remain<=1;
  showModal(`<h3>⚠️ ตรวจพบการออกจากหน้าจอ</h3>
    <p>ระบบตรวจพบว่าท่านออกจากหน้าจอข้อสอบนานเกินกำหนด (ครั้งที่ ${leaveCount} จาก ${EXAM.maxLeaves}) คำตอบของท่านยังอยู่ครบ และระบบบันทึกประวัติไว้ให้ผู้สอนแล้ว</p>
    <p><b>${lastWarning?'หากออกจากหน้าจอลักษณะนี้อีกครั้ง ระบบจะส่งคำตอบที่พิมพ์ไว้และปิดการสอบทันที':'หากออกจากหน้าจอลักษณะนี้ครบอีก '+remain+' ครั้ง (ครั้งที่ '+EXAM.maxLeaves+') ระบบจะบังคับส่งคำตอบและปิดการสอบทันที'}</b></p>
    <div class="modal-actions"><button class="btn btn-primary" id="w-ok">เข้าใจแล้ว ทำข้อสอบต่อ</button></div>`, true);
  document.getElementById('w-ok').onclick=closeModals;
}
function inactive(){return !examActive||unloading||closing||submitting;}
function onHidden(){
  if(inactive()) return;
  const ta=document.getElementById('answer'); if(ta&&dirty) lsSet(LS_DRAFT,{studentId:identity.studentId,text:ta.value,savedAt:Date.now(),pasteEvents});
  if(!away){
    const ev=away={id:uid(),start:Date.now(),kind:'hidden',counted:false,durationMs:null};
    reportLeave(ev,true).then(r=>applyLeaveResponse(r,ev,false)); // บันทึกไว้ก่อนทันที (ยังไม่นับ) กันกรณีไม่กลับมาเลย
    ev.timer=setTimeout(()=>{
      if(away===ev&&!ev.counted){
        ev.counted=true;
        reportLeave(ev,true).then(r=>applyLeaveResponse(r,ev,false));
      }
    },HIDDEN_GRACE_MS);
  }
}
function checkBack(){
  if(!away||!examActive||closing||submitting) return;
  if(document.hidden) return;
  clearTimeout(away.timer);
  const ev=away; away=null; ev.durationMs=Date.now()-ev.start;
  reportLeaveRetry(ev).then(r=>applyLeaveResponse(r,ev,true));
}
document.addEventListener('visibilitychange',()=>{ if(document.hidden) onHidden(); else checkBack(); });
window.addEventListener('focus',checkBack);
window.addEventListener('beforeunload',()=>{unloading=true;});
window.addEventListener('pagehide',e=>{ if(!e.persisted) unloading=true; });
window.addEventListener('pageshow',e=>{ if(e.persisted) unloading=false; });

async function finalSubmit(auto){

  if(r.ok&&r.data&&r.data.ok){ closeExam(r.data.reason||(auto?'timeout':'manual')); return; }
  submitting=false;

  if(auto) setTimeout(()=>{ if(examActive&&!submitting) finalSubmit(true); },5000);
}
function closeExam(reason){
  if(closing) return;

/* ================= สำหรับอาจารย์ (ซ่อนหลังลิงก์ในหน้าแรก + รหัสผ่าน) ================= */
const AdminApp = (function(){
let RUBRIC = []; // โหลดจากเซิร์ฟเวอร์หลังใส่รหัสผ่านอาจารย์ถูกต้องเท่านั้น (ไม่ฝังในหน้าเว็บ)
let TOTAL_SCORE = 0;
const EXAM_TITLE = EXAM.courseCode+' '+EXAM.courseTh+' · '+EXAM.title;
const API = '/api/essay';
const SS_KEY = 'pl092028_admin_pass';
const root = document.getElementById('root');
let passcode = '';
let items = [];
let serverOffset = 0;
let sortKey = 'submittedAt', sortDir = -1;
let filterMode = 'all', searchText = '';
let visibleRows = [];
let detailId = null;

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function pad(n){return String(n).padStart(2,'0');}
function fmtDT(ms){ if(!ms) return '—'; const d=new Date(ms); return pad(d.getDate())+'/'+pad(d.getMonth()+1)+' '+pad(d.getHours())+':'+pad(d.getMinutes()); }
function fmtDur(ms){ if(ms==null) return '—'; const s=Math.round(ms/1000); if(s<60) return s+' วินาที'; const m=Math.floor(s/60); if(m<60) return m+' นาที'; return Math.floor(m/60)+' ชม. '+(m%60)+' นาที'; }
function reasonLabel(r){return {manual:'ส่งเอง',auto_leave:'ปิดอัตโนมัติ (ออกจากหน้าจอ)',timeout:'หมดเวลา'}[r]||'—';}
function showModal(html,persist){const o=document.createElement('div');o.className='modal-overlay';o.innerHTML='<div class="modal-box">'+html+'</div>';document.body.appendChild(o);if(!persist)o.addEventListener('click',e=>{if(e.target===o)o.remove();});return o;}
function closeModals(){document.querySelectorAll('.modal-overlay').forEach(m=>m.remove());}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200);}

async function adm(method, query, body){
  const opts={method,headers:{'X-Admin-Passcode':passcode}};
  if(body){opts.headers['Content-Type']='application/json';opts.body=JSON.stringify(body);}
  const url=method==='GET'?API+'?'+new URLSearchParams(query):API;
  try{const res=await fetch(url,opts);return {ok:true,status:res.status,data:await res.json()};}
  catch(e){return {ok:false};}
}

/* ---------- gate ---------- */
function renderGate(msg){
  root.innerHTML=`<div class="wrap"><div class="brand">สำหรับอาจารย์ผู้สอน</div>
  <div class="card" style="max-width:440px;margin:40px auto">
    <h2>ตรวจข้อสอบปลายภาค</h2><p>${esc(EXAM_TITLE)}</p>

    <div class="field"><label for="pw">รหัสผ่านอาจารย์</label><input id="pw" type="password" autocomplete="current-password"></div>
    <button class="btn btn-primary btn-block" id="pw-go">เข้าสู่ระบบ</button>
  </div></div>`;
  const go=async()=>{
    const v=document.getElementById('pw').value; if(!v) return;

    passcode=v;
    const r=await adm('GET',{action:'auth'});
    if(!r.ok){renderGate('เชื่อมต่อระบบไม่สำเร็จ');return;}
    if(r.status===200&&r.data.ok){ try{sessionStorage.setItem(SS_KEY,v);}catch(e){} loadList(); return; }
    passcode='';
    if(r.status===429){renderGate('ใส่รหัสผิดหลายครั้งเกินไป กรุณารอ '+Math.ceil((r.data.retryAfterSec||600)/60)+' นาที แล้วลองใหม่');return;}
    renderGate('รหัสผ่านไม่ถูกต้อง');
  };
  document.getElementById('pw-go').onclick=go;
  document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')go();});
}

/* ---------- list ---------- */
async function loadList(){

function statusOf(it){return it.status==='submitted'?(it.gradeTotal==null?'ungraded':'graded'):'prog';}
function matches(it){
  const q=searchText.trim().toLowerCase();
  if(q&&!(it.name+' '+it.lastname+' '+it.studentId+' '+(it.section||'')).toLowerCase().includes(q)) return false;
  if(filterMode==='prog') return it.status!=='submitted';
  if(filterMode==='ungraded') return it.status==='submitted'&&it.gradeTotal==null;
  if(filterMode==='graded') return it.gradeTotal!=null;
  if(filterMode==='leave') return it.leaveCount>0;
  if(filterMode==='auto') return it.submitReason==='auto_leave';
  if(filterMode==='paste') return it.maxPaste>=300;
  return true;
}
function sortVal(it,k){
  if(k==='name') return (it.name+' '+it.lastname);
  if(k==='status') return statusOf(it);
  const v=it[k]; return v==null?-1:v;
}

function csvCell(v){const s=String(v==null?'':v);return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
function exportCsv(){
  const head=['ลำดับ','ชื่อ','นามสกุล','รหัสนักศึกษา','กลุ่ม','สถานะ','วิธีส่ง','เริ่มสอบ','ส่งเมื่อ','ออกจากหน้าจอ(ครั้ง)','วางข้อความ(ครั้ง)','วางสูงสุด(ตัวอักษร)','จำนวนคำ']
    .concat(RUBRIC.map((c,i)=>(i+1)+'. '+c.title+' (/'+c.max+')')).concat(['รวม (/'+TOTAL_SCORE+')','ความเห็นผู้ตรวจ']);
  const iso=ms=>ms?new Date(ms).toLocaleString('th-TH'):'';
  const lines=[head.map(csvCell).join(',')];
  items.slice().sort((a,b)=>String(a.studentId).localeCompare(String(b.studentId))).forEach((it,i)=>{
    const gp=it.gradePoints||{};
    lines.push([i+1,it.name,it.lastname,it.studentId,it.section||'',it.status==='submitted'?'ส่งแล้ว':'กำลังทำ',reasonLabel(it.submitReason)==='—'?'':reasonLabel(it.submitReason),iso(it.startedAt),iso(it.submittedAt),it.leaveCount,it.pasteCount,it.maxPaste,it.wordCount]
      .concat(RUBRIC.map(c=>it.gradePoints?gp[c.id]:'')).concat([it.gradeTotal==null?'':it.gradeTotal,it.gradeComment||'']).map(csvCell).join(','));
  });
  const blob=new Blob(['\uFEFF'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ผลตรวจข้อสอบ_พล092028.csv';document.body.appendChild(a);a.click();a.remove();
}

function leaveKind(k){return k==='hidden'?'ซ่อนหน้าต่าง/สลับแท็บ/แอป':'เสียโฟกัสหน้าต่าง';}
function detectCitations(text){
  if(!text) return [];
  const found=new Set();
  const re1=/\(([^()]{2,80}?(?:19|20)\d{2}[a-z]?)\)/g;
  const re2=/\b([A-Za-z][A-Za-z&.,'\s]{1,60}?)\s*\((?:19|20)\d{2}[a-z]?\)/g;
  let m;
  while((m=re1.exec(text))){ found.add('('+m[1].trim()+')'); }
  while((m=re2.exec(text))){ found.add(m[0].trim()); }
  return Array.from(found).sort();
}

      statusEl.innerHTML='<span style="color:var(--ok)">AI เสนอคะแนนแล้ว — กรุณาตรวจทานทุกเกณฑ์ก่อนกดบันทึกคะแนน</span>';
      (r.data.suggestions||[]).forEach(s=>{
        const c=RUBRIC.find(x=>x.id===s.id); if(!c||!inputs[c.id]) return;
        const p=Math.max(0,Math.min(c.max,Math.round(Number(s.points))));
        inputs[c.id].value=p; sync(c);
        const reasonEl=root.querySelector('[data-ai="'+c.id+'"]');
        if(reasonEl&&s.reasoning){ reasonEl.textContent='AI: '+s.reasoning; reasonEl.classList.add('show'); }
      });
    };
  }
  document.getElementById('save-grade').onclick=async()=>{
    const points={}; let missing=null;
    RUBRIC.forEach(c=>{const v=inputs[c.id].value; if(v==='') missing=missing||c; else points[c.id]=Math.round(Number(v));});
    const msg=document.getElementById('save-msg');
    if(missing){ msg.innerHTML='<span style="color:var(--danger)">กรุณาให้คะแนนให้ครบทุกเกณฑ์ (ยังขาด: '+esc(missing.title)+')</span>'; return; }
    const btn=document.getElementById('save-grade'); btn.disabled=true; btn.textContent='กำลังบันทึก...';
    const r=await adm('POST',null,{action:'grade',studentId:a.studentId,points,comment:document.getElementById('cmt').value});
    btn.disabled=false; btn.textContent='บันทึกคะแนน';
    if(r.ok&&r.data&&r.data.ok){
      msg.innerHTML='<span style="color:var(--ok)">บันทึกแล้ว · รวม '+r.data.total+' / '+TOTAL_SCORE+'</span>'; toast('บันทึกคะแนนแล้ว');
      const it=items.find(x=>x.studentId===a.studentId); if(it){it.gradeTotal=r.data.total;it.gradePoints=points;it.gradeComment=document.getElementById('cmt').value;}
    }else{
      msg.innerHTML='<span style="color:var(--danger)">บันทึกไม่สำเร็จ ('+esc((r.data&&r.data.err)||'เชื่อมต่อไม่ได้')+')</span>';
    }
  };
}
function confirmDelete(a){
  showModal(`<h3>ลบรายการของ ${esc(a.name)} ${esc(a.lastname)}?</h3>
    <p>จะลบคำตอบ ประวัติ และคะแนนของรหัส ${esc(a.studentId)} ทั้งหมด และไม่สามารถกู้คืนได้ ใช้สำหรับล้างข้อมูลทดสอบ หรือเปิดสิทธิ์ให้นักศึกษาเริ่มใหม่</p>
    <div class="modal-actions"><button class="btn btn-ghost" id="x-no">ยกเลิก</button><button class="btn btn-danger" id="x-yes">ลบรายการ</button></div>`,true);
  document.getElementById('x-no').onclick=closeModals;
  document.getElementById('x-yes').onclick=async()=>{
    const r=await adm('POST',null,{action:'delete',studentId:a.studentId}); closeModals();
    if(r.ok&&r.data&&r.data.ok){toast('ลบแล้ว');loadList();}else toast('ลบไม่สำเร็จ');
  };
}

  function openAdmin(){
    let s=null; try{s=sessionStorage.getItem(SS_KEY);}catch(e){}
    if(s){ passcode=s; loadList(); } else renderGate();
  }
  return { open: openAdmin };
})();

/* ---------- init ---------- */
(function init(){
  const saved=lsGet(LS_ID);
  if(saved&&saved.studentId&&saved.name&&saved.lastname) renderResumePrompt(saved);
  else renderLanding();
})();
</script>
